<header class="fixed top-0 left-0 w-full z-[999] px-6 md:px-10 py-6 md:py-8 flex justify-between items-center mix-blend-difference">
  
  <a routerLink="/" class="cursor-pointer group">
    <h1 class="text-white font-black tracking-tighter text-lg md:text-xl uppercase transition-all group-hover:tracking-widest">
      AlquimIA
    </h1>
  </a>

  <nav class="flex gap-5 md:gap-10 items-center">
    <a routerLink="/" class="text-white/60 hover:text-white text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] transition-all duration-500">
      Início
    </a>
    <a routerLink="/sobre" class="text-white/60 hover:text-white text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] transition-all duration-500">
      Sobre
    </a>

    <div class="relative">
      <button 
        (click)="toggleMenu()"
        (mouseenter)="isMenuOpen = true"
        class="text-white/60 hover:text-white text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] transition-all duration-500 flex items-center gap-1 md:gap-2 outline-none cursor-pointer">
        Serviços 
        <svg 
          class="w-2 h-2 transition-transform duration-500" 
          [ngClass]="{'rotate-180 text-white': isMenuOpen}"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div 
        (mouseleave)="isMenuOpen = false"
        [ngClass]="isMenuOpen ? 'opacity-100 visible translate-y-0' : 'opacity-0 invisible -translate-y-2'"
        class="absolute right-[-20px] md:right-0 mt-4 w-48 md:w-56 bg-[#0a0a0a] border border-white/10 transition-all duration-500 z-[9999] p-2 shadow-2xl">
        
        <div class="flex flex-col">
          <a routerLink="/sites" (click)="isMenuOpen = false" class="px-5 py-4 text-[9px] uppercase tracking-[0.2em] text-white hover:text-accent hover:bg-white/[0.05] transition-all duration-300">
            Arquitetura Web
          </a>
          <a routerLink="/automacao" (click)="isMenuOpen = false" class="px-5 py-4 text-[9px] uppercase tracking-[0.2em] text-white hover:text-accent hover:bg-white/[0.05] transition-all duration-300 border-t border-white/5">
            Automação de IA
          </a>
          <a routerLink="/design" (click)="isMenuOpen = false" class="px-5 py-4 text-[9px] uppercase tracking-[0.2em] text-white hover:text-accent hover:bg-white/[0.05] transition-all duration-300 border-t border-white/5">
            Design Estratégico
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="hidden lg:block">
    <a routerLink="/contato" class="border border-white/10 px-8 py-3 text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-white hover:text-black transition-all duration-700 cursor-pointer inline-block">
      Entrar em Contato
    </a>
  </div>

</header>
