<header class="fixed top-0 left-0 w-full z-[999] px-10 py-8 flex justify-between items-center mix-blend-difference">

      AlquimIA
    </h1>

        <svg class="w-2 h-2 transition-transform duration-500 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">

          <a routerLink="/design" class="px-5 py-4 text-[9px] uppercase tracking-[0.2em] text-white hover:text-accent hover:bg-white/[0.05] transition-all duration-300 border-t border-white/5">

          </a>
        </div>

    </div>

  <div class="hidden md:block">
    <a routerLink="/contato" class="border border-white/10 px-8 py-3 text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-white hover:text-black transition-all duration-700 cursor-pointer inline-block">
